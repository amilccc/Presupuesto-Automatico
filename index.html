<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos & Presupuesto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">

  <div class="max-w-md mx-auto p-4 space-y-6">

    <!-- ENCABEZADO -->
    <header class="flex justify-between items-center bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-xl">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Mi Presupuesto</h1>
        <p class="text-xs text-slate-400" id="lblQuincenaInfo">Cargando fecha...</p>
      </div>
      <button onclick="cargarDatos()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-2xl transition-all shadow-lg active:scale-95">
        <i class="fa-solid fa-rotate text-sm" id="iconReload"></i>
      </button>
    </header>

    <!-- SELECTOR DE MES Y QUINCENA -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Mes</label>
        <select id="selectMes" onchange="cambiarFiltro()" class="w-full bg-slate-800 text-white text-sm rounded-xl p-2 outline-none border border-slate-700">
          <option value="1">Enero</option>
          <option value="2">Febrero</option>
          <option value="3">Marzo</option>
          <option value="4">Abril</option>
          <option value="5">Mayo</option>
          <option value="6">Junio</option>
          <option value="7">Julio</option>
          <option value="8">Agosto</option>
          <option value="9">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>
      </div>
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800">
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Quincena</label>
        <select id="selectQuincena" onchange="cambiarFiltro()" class="w-full bg-slate-800 text-white text-sm rounded-xl p-2 outline-none border border-slate-700">
          <option value="1">1ra Quincena (1-15)</option>
          <option value="2">2da Quincena (16-Fin)</option>
        </select>
      </div>
    </section>

    <!-- TARJETAS DE TOTALES POR TARJETA -->
    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Gastos por Tarjeta / Medio</h2>
      <div id="contenedorTarjetas" class="grid grid-cols-2 gap-3">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

    <!-- BARRAS DE PRESUPUESTO POR CATEGORÍA -->
    <section class="space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Presupuesto por Categoría</h2>
      <div id="contenedorPresupuesto" class="space-y-3">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

    <!-- BOTÓN REGISTRAR PAGO Y FORMULARIO -->
    <section>
      <button onclick="toggleFormulario()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-plus text-sm"></i>
        <span>Registrar Pago / Abono</span>
      </button>

      <form id="formGasto" onsubmit="enviarGasto(event)" class="hidden mt-4 bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4 shadow-2xl">
        <h3 class="text-sm font-bold text-white border-b border-slate-800 pb-2">Nuevo Registro</h3>
        
        <div>
          <label class="block text-xs text-slate-400 mb-1">Monto (Q)</label>
          <input type="number" step="0.01" id="inputMonto" required placeholder="0.00" class="w-full bg-slate-800 text-white p-3 rounded-xl outline-none border border-slate-700 text-lg font-bold">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Comercio / Descripción</label>
          <input type="text" id="inputComercio" required placeholder="Ej. Supermercado, Gasolina..." class="w-full bg-slate-800 text-white p-3 rounded-xl outline-none border border-slate-700 text-sm">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Tarjeta / Método de Pago</label>
          <select id="selectTarjetaForm" class="w-full bg-slate-800 text-white p-3 rounded-xl outline-none border border-slate-700 text-sm">
            <option value="Efectivo">Efectivo</option>
            <option value="BAC">BAC</option>
            <option value="Cuscatlan">Cuscatlan</option>
            <option value="Promerica">Promerica</option>
            <option value="Bi">Bi</option>
            <option value="Apple Pay">Apple Pay</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Categoría de Presupuesto</label>
          <select id="selectCategoriaForm" class="w-full bg-slate-800 text-white p-3 rounded-xl outline-none border border-slate-700 text-sm">
            <!-- Cargado dinámicamente desde el Sheet -->
          </select>
        </div>

        <button type="submit" id="btnGuardar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95">
          Guardar Registro
        </button>
      </form>
    </section>

    <!-- HISTORIAL DE ÚLTIMOS MOVIMIENTOS -->
    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Historial de Transacciones</h2>
      <div id="contenedorHistorial" class="space-y-2">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

  </div>

  <script>
    // ** COLOCA AQUÍ LA URL DE TU WEB APP IMPLEMENTADA EN APPS SCRIPT **
    const WEB_APP_URL = "URL_DE_TU_APPS_SCRIPT_AQUI";

    let datosPresupuesto = [];
    let datosMovimientos = [];
    let listaCategorias = [];

    const fechaHoy = new Date();
    let mesActual = fechaHoy.getMonth() + 1;
    let quincenaActual = fechaHoy.getDate() <= 15 ? 1 : 2;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('selectMes').value = mesActual;
      document.getElementById('selectQuincena').value = quincenaActual;
      actualizarLabelFecha();
      cargarDatos();
    });

    function actualizarLabelFecha() {
      const mesesNom = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      document.getElementById('lblQuincenaInfo').innerText = `${quincenaActual === 1 ? '1ra' : '2da'} Quincena - ${mesesNom[mesActual - 1]}`;
    }

    function cambiarFiltro() {
      mesActual = parseInt(document.getElementById('selectMes').value);
      quincenaActual = parseInt(document.getElementById('selectQuincena').value);
      actualizarLabelFecha();
      renderTodo();
    }

    function cargarDatos() {
      const icon = document.getElementById('iconReload');
      if (icon) icon.classList.add('fa-spin');

      const script = document.createElement('script');
      script.src = `${WEB_APP_URL}?callback=procesarRespuestaScript`;
      document.body.appendChild(script);
    }

    function procesarRespuestaScript(response) {
      const icon = document.getElementById('iconReload');
      if (icon) icon.classList.remove('fa-spin');

      if (!response) return;

      datosPresupuesto = response.presupuesto || [];
      datosMovimientos = response.movimientos || [];
      listaCategorias = response.categorias || [];

      poblarCategoriasForm();
      renderTodo();
    }

    function poblarCategoriasForm() {
      const select = document.getElementById('selectCategoriaForm');
      select.innerHTML = '';
      if (listaCategorias.length === 0) {
        select.innerHTML = '<option value="General">General</option>';
        return;
      }
      listaCategorias.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function renderTodo() {
      renderTarjetasTotales();
      renderPresupuesto();
      renderHistorial();
    }

    // RENDERIZADO DE TARJETAS
    function renderTarjetasTotales() {
      const container = document.getElementById('contenedorTarjetas');
      container.innerHTML = '';

      const totales = {};

      datosMovimientos.forEach(m => {
        const fecha = m[0] ? new Date(m[0]) : null;
        const tarjeta = (m[1] || 'Otros').toString().trim();
        const monto = parseFloat(m[3]) || 0;

        if (fecha) {
          const mMes = fecha.getMonth() + 1;
          const mDia = fecha.getDate();
          const mQ = mDia <= 15 ? 1 : 2;

          if (mMes === mesActual && mQ === quincenaActual) {
            totales[tarjeta] = (totales[tarjeta] || 0) + monto;
          }
        }
      });

      const keys = Object.keys(totales);
      if (keys.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs col-span-2 text-center py-4 bg-slate-900 rounded-2xl border border-slate-800">No hay gastos en esta quincena.</p>';
        return;
      }

      keys.forEach(tarj => {
        container.innerHTML += `
          <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-1 shadow-md min-w-0">
            <span class="text-xs text-slate-400 font-medium truncate block w-full" title="${tarj}">${tarj}</span>
            <span class="text-lg font-extrabold text-white tracking-tight truncate block w-full">Q${totales[tarj].toFixed(2)}</span>
          </div>
        `;
      });
    }

    // RENDERIZADO DE BARRAS DE PRESUPUESTO
    function renderPresupuesto() {
      const container = document.getElementById('contenedorPresupuesto');
      container.innerHTML = '';

      if (!datosPresupuesto || datosPresupuesto.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center text-sm py-4">No hay presupuesto configurado.</p>';
        return;
      }

      datosPresupuesto.forEach(row => {
        const categoria = row[0];
        if (!categoria) return;

        const ideal = quincenaActual === 1 ? parseFloat(row[1]) || 0 : parseFloat(row[4]) || 0;

        let gastadoCalculado = 0;
        datosMovimientos.forEach(m => {
          const fecha = m[0] ? new Date(m[0]) : null;
          const catMov = (m[4] || '').toString().trim().toLowerCase();
          const catPres = categoria.toString().trim().toLowerCase();
          const monto = parseFloat(m[3]) || 0;

          if (fecha && catMov === catPres) {
            const mMes = fecha.getMonth() + 1;
            const mDia = fecha.getDate();
            const mQ = mDia <= 15 ? 1 : 2;

            if (mMes === mesActual && mQ === quincenaActual) {
              gastadoCalculado += monto;
            }
          }
        });

        const gastadoHoja = quincenaActual === 1 ? parseFloat(row[2]) || 0 : parseFloat(row[5]) || 0;
        const totalGastado = gastadoCalculado > 0 ? gastadoCalculado : gastadoHoja;
        const disponible = ideal - totalGastado;

        if (ideal > 0 || totalGastado > 0) {
          const porcentaje = ideal > 0 ? Math.min(100, Math.round((totalGastado / ideal) * 100)) : 0;
          const esNegativo = disponible < 0;

          container.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-slate-200 text-sm truncate pr-2">${categoria}</span>
                <span class="text-xs font-bold ${esNegativo ? 'text-red-400' : 'text-emerald-400'} shrink-0">
                  Disp: Q${disponible.toFixed(2)}
                </span>
              </div>
              <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="${esNegativo ? 'bg-red-500' : 'bg-emerald-500'} h-full transition-all duration-300" style="width: ${porcentaje}%"></div>
              </div>
              <div class="flex justify-between text-[11px] text-slate-400">
                <span>Gastado: Q${totalGastado.toFixed(2)}</span>
                <span>Ideal: Q${ideal.toFixed(2)}</span>
              </div>
            </div>
          `;
        }
      });
    }

    // RENDERIZADO DEL HISTORIAL DE TRANSACCIONES
    function renderHistorial() {
      const container = document.getElementById('contenedorHistorial');
      container.innerHTML = '';

      const filtrados = datosMovimientos.filter(m => {
        const fecha = m[0] ? new Date(m[0]) : null;
        if (!fecha) return false;
        const mMes = fecha.getMonth() + 1;
        const mDia = fecha.getDate();
        const mQ = mDia <= 15 ? 1 : 2;
        return mMes === mesActual && mQ === quincenaActual;
      }).reverse();

      if (filtrados.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs text-center py-4 bg-slate-900 rounded-2xl border border-slate-800">No hay movimientos en este periodo.</p>';
        return;
      }

      filtrados.forEach(m => {
        const fecha = new Date(m[0]).toLocaleDateString('es-GT', { day: '2-digit', month: '2-digit' });
        const tarj = m[1] || 'Efectivo';
        const comercio = m[2] || 'Gasto';
        const monto = parseFloat(m[3]) || 0;
        const cat = m[4] || 'General';

        container.innerHTML += `
          <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex justify-between items-center space-x-3">
            <div class="min-w-0 flex-1">
              <p class="text-xs font-bold text-slate-200 truncate">${comercio}</p>
              <p class="text-[10px] text-slate-400 truncate">${fecha} • ${tarj} • <span class="text-indigo-400">${cat}</span></p>
            </div>
            <span class="text-sm font-extrabold text-slate-100 shrink-0">Q${monto.toFixed(2)}</span>
          </div>
        `;
      });
    }

    function toggleFormulario() {
      const form = document.getElementById('formGasto');
      form.classList.toggle('hidden');
    }

    function enviarGasto(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.innerText = 'Guardando...';
      btn.disabled = true;

      const payload = {
        fecha: new Date().toISOString(),
        monto: parseFloat(document.getElementById('inputMonto').value),
        comercio: document.getElementById('inputComercio').value,
        tarjeta: document.getElementById('selectTarjetaForm').value,
        categoria: document.getElementById('selectCategoriaForm').value
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('¡Gasto registrado con éxito!');
        document.getElementById('formGasto').reset();
        toggleFormulario();
        btn.innerText = 'Guardar Registro';
        btn.disabled = false;
        cargarDatos();
      }).catch(err => {
        alert('Error al guardar: ' + err);
        btn.innerText = 'Guardar Registro';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>

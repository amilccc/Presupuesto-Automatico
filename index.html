<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Presupuesto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-12 font-sans">

  <div class="max-w-md mx-auto space-y-5">
    <!-- Encabezado -->
    <header class="text-center py-1">
      <h1 class="text-2xl font-bold text-emerald-400">📊 Control Financiero</h1>
      <p class="text-xs text-slate-400 mt-0.5">Sincronizado con Google Sheets</p>
    </header>

    <!-- Navegación de Pestañas -->
    <div class="flex bg-slate-900 p-1 rounded-2xl border border-slate-800">
      <button id="tabPresupuesto" onclick="cambiarPestana('presupuesto')" class="w-1/2 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white shadow transition">📊 Presupuesto</button>
      <button id="tabTarjetas" onclick="cambiarPestana('tarjetas')" class="w-1/2 py-2 text-xs font-bold rounded-xl text-slate-400 transition">💳 Gastos Tarjeta</button>
    </div>

    <!-- Filtros: Mes y Quincena -->
    <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1 px-1">Mes</label>
          <select id="selectMes" onchange="filtrarDatos()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2 text-xs outline-none focus:border-emerald-500 font-medium">
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1 px-1">Quincena</label>
          <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700/50">
            <button id="btnQ1" onclick="cambiarQuincena(1)" class="w-1/2 py-1 text-[11px] font-bold rounded-lg bg-emerald-600 text-white shadow transition">1ra Q</button>
            <button id="btnQ2" onclick="cambiarQuincena(2)" class="w-1/2 py-1 text-[11px] font-bold rounded-lg text-slate-400 transition">2da Q</button>
          </div>
        </div>
      </div>
    </div>

    <!-- VISTA 1: Dashboard Presupuesto -->
    <div id="vistaPresupuesto" class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-300">Presupuesto por Categoría</h2>
        <button onclick="cargarDatos()" class="text-xs text-emerald-400 hover:text-emerald-300">🔄 Actualizar</button>
      </div>
      <div id="contenedorPresupuesto" class="space-y-3">
        <p class="text-center text-slate-500 text-sm py-4">Cargando presupuesto...</p>
      </div>
    </div>

    <!-- VISTA 2: Gastos por Tarjeta -->
    <div id="vistaTarjetas" class="space-y-3 hidden">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-300">Historial de Gastos por Tarjeta</h2>
        <button onclick="cargarDatos()" class="text-xs text-emerald-400 hover:text-emerald-300">🔄 Actualizar</button>
      </div>
      <div id="contenedorTarjetas" class="space-y-2">
        <p class="text-center text-slate-500 text-sm py-4">Cargando lista de gastos...</p>
      </div>
    </div>

    <!-- Formulario para Movimientos Manuales -->
    <div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4">
      <h2 class="text-base font-bold text-white border-b border-slate-800 pb-2">➕ Registrar Pago / Abono</h2>
      
      <form id="formMovimiento" onsubmit="guardarMovimiento(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-400">Tipo de Movimiento</label>
          <select id="tipo" class="w-full mt-1 bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
            <option value="Gasto Tarjeta">Gasto Tarjeta</option>
            <option value="Gasto Efectivo">Gasto Efectivo</option>
            <option value="Abono a Tarjeta">Abono a Tarjeta</option>
            <option value="Ingreso">Ingreso / Pago</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400">Cuenta / Tarjeta</label>
          <select id="cuenta" class="w-full mt-1 bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
            <option value="BAC">BAC</option>
            <option value="Cuscatlán">Cuscatlán</option>
            <option value="Promerica">Promerica</option>
            <option value="Efectivo">Efectivo</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400">Categoría del Presupuesto</label>
          <input type="text" id="categoria" placeholder="Ej. Agua, Luz, Supermercado" class="w-full mt-1 bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-emerald-500" required>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400">Descripción / Establecimiento</label>
          <input type="text" id="descripcion" placeholder="Ej. Compra súper, Pago recibo" class="w-full mt-1 bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-emerald-500" required>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400">Monto (Q)</label>
          <input type="number" step="0.01" id="monto" placeholder="0.00" class="w-full mt-1 bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-emerald-500" required>
        </div>

        <button type="submit" id="btnGuardar" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3.5 rounded-xl transition text-slate-950 mt-2 text-sm shadow-lg shadow-emerald-500/20">
          Guardar en Google Sheets
        </button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHlGKS-3U6gWVRj4Gnfi6Fc6Nos1saU8CvzXfsb2S43MJYg_E7hdEwGMADH7Ph4Us/exec';

    let datosPresupuesto = [];
    let datosMovimientos = [];
    let quincenaActual = 1;
    let mesActual = new Date().getMonth() + 1;
    let pestanaActiva = 'presupuesto';

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('selectMes').value = mesActual;
    });

    function cargarDatos() {
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${SCRIPT_URL}?callback=procesarRespuesta&_=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function procesarRespuesta(data) {
      datosPresupuesto = data.presupuesto || [];
      datosMovimientos = data.movimientos || [];
      filtrarDatos();
    }

    function cambiarPestana(pestana) {
      pestanaActiva = pestana;
      const tabP = document.getElementById('tabPresupuesto');
      const tabT = document.getElementById('tabTarjetas');
      const vistaP = document.getElementById('vistaPresupuesto');
      const vistaT = document.getElementById('vistaTarjetas');

      if (pestana === 'presupuesto') {
        tabP.className = "w-1/2 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white shadow transition";
        tabT.className = "w-1/2 py-2 text-xs font-bold rounded-xl text-slate-400 transition";
        vistaP.classList.remove('hidden');
        vistaT.classList.add('hidden');
      } else {
        tabT.className = "w-1/2 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white shadow transition";
        tabP.className = "w-1/2 py-2 text-xs font-bold rounded-xl text-slate-400 transition";
        vistaT.classList.remove('hidden');
        vistaP.classList.add('hidden');
      }
    }

    function cambiarQuincena(q) {
      quincenaActual = q;
      document.getElementById('btnQ1').className = q === 1 ? "w-1/2 py-1 text-[11px] font-bold rounded-lg bg-emerald-600 text-white shadow transition" : "w-1/2 py-1 text-[11px] font-bold rounded-lg text-slate-400 transition";
      document.getElementById('btnQ2').className = q === 2 ? "w-1/2 py-1 text-[11px] font-bold rounded-lg bg-emerald-600 text-white shadow transition" : "w-1/2 py-1 text-[11px] font-bold rounded-lg text-slate-400 transition";
      filtrarDatos();
    }

    function filtrarDatos() {
      mesActual = parseInt(document.getElementById('selectMes').value);
      renderPresupuesto();
      renderTarjetas();
    }

    function renderPresupuesto() {
      const container = document.getElementById('contenedorPresupuesto');
      container.innerHTML = '';

      if (datosPresupuesto.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center text-sm py-4">No hay datos en el presupuesto.</p>';
        return;
      }

      datosPresupuesto.forEach(row => {
        const categoria = row[0];
        if (!categoria) return;

        const ideal = quincenaActual === 1 ? parseFloat(row[1]) || 0 : parseFloat(row[4]) || 0;
        const gastado = quincenaActual === 1 ? parseFloat(row[2]) || 0 : parseFloat(row[5]) || 0;
        const disponible = quincenaActual === 1 ? parseFloat(row[3]) || 0 : parseFloat(row[6]) || 0;

        if (ideal > 0 || gastado > 0) {
          const porcentaje = ideal > 0 ? Math.min(100, Math.round((gastado / ideal) * 100)) : 0;
          const esNegativo = disponible < 0;

          container.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
              <div class="flex justify-between items-center">
                <span class="font-bold text-slate-200 text-sm">${categoria}</span>
                <span class="text-xs font-bold ${esNegativo ? 'text-red-400' : 'text-emerald-400'}">
                  Disp: Q${disponible.toFixed(2)}
                </span>
              </div>
              <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="${esNegativo ? 'bg-red-500' : 'bg-emerald-500'} h-full transition-all duration-300" style="width: ${porcentaje}%"></div>
              </div>
              <div class="flex justify-between text-[11px] text-slate-400">
                <span>Gastado: Q${gastado.toFixed(2)}</span>
                <span>Ideal: Q${ideal.toFixed(2)}</span>
              </div>
            </div>
          `;
        }
      });
    }

    function renderTarjetas() {
      const container = document.getElementById('contenedorTarjetas');
      container.innerHTML = '';

      if (datosMovimientos.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center text-sm py-4">No hay gastos en tarjetas registrados.</p>`;
        return;
      }

      datosMovimientos.slice().reverse().forEach(m => {
        const fecha = m[0] ? new Date(m[0]).toLocaleDateString() : 'N/A';
        const tarjeta = m[1] || 'Tarjeta';
        const comercio = m[2] || 'Comercio';
        const monto = parseFloat(m[3]) || 0;

        container.innerHTML += `
          <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-200 text-sm">${comercio}</span>
                <span class="text-[10px] bg-slate-800 border border-slate-700 text-emerald-400 px-2 py-0.5 rounded-md">${tarjeta}</span>
              </div>
              <p class="text-[11px] text-slate-400">${fecha}</p>
            </div>
            <span class="font-bold text-sm text-red-400">-Q${monto.toFixed(2)}</span>
          </div>
        `;
      });
    }

    async function guardarMovimiento(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.innerText = 'Guardando...';
      btn.disabled = true;

      const payload = {
        tipo: document.getElementById('tipo').value,
        tarjeta: document.getElementById('cuenta').value,
        categoria: document.getElementById('categoria').value,
        comercio: document.getElementById('descripcion').value,
        monto: document.getElementById('monto').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        alert('¡Movimiento guardado con éxito!');
        document.getElementById('formMovimiento').reset();
        setTimeout(cargarDatos, 1500);
      } catch (err) {
        alert('Error al guardar el movimiento.');
      } finally {
        btn.innerText = 'Guardar en Google Sheets';
        btn.disabled = false;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
